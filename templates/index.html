<!DOCTYPE html>
<html>
<head>
    <title>House Price Predictor</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="card">
    <h1>🏠 Price Predictor</h1>

    <div class="input-group">
        <input type="number" id="area" required>
        <label>Area (sqft)</label>
    </div>

    <div class="input-group">
        <input type="number" id="bedrooms" required>
        <label>Bedrooms</label>
    </div>

    <div class="input-group">
        <input type="number" id="bathrooms" required>
        <label>Bathrooms</label>
    </div>

    <div class="input-group">
        <input type="number" id="floors" required>
        <label>Floors</label>
    </div>

    <div class="input-group">
        <input type="number" id="waterfront" required>
        <label>Waterfront (0/1)</label>
    </div>

    <div class="input-group">
        <input type="number" id="grade" required>
        <label>Grade (1-13)</label>
    </div>

    <button onclick="predict()">Predict</button>

    <div id="loader"></div>
    <div id="result"></div>
</div>

<script src="/static/script.js"></script>
</body>
</html>
